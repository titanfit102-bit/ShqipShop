name: Medusa v2 development backend smoke test

on:
  push:
    branches: [feat/medusa-v2-backend-poc]
    paths:
      - medusa-backend-poc/**
      - .github/workflows/medusa-backend-smoke.yml
  pull_request:
    paths:
      - medusa-backend-poc/**
      - .github/workflows/medusa-backend-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medusa-backend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-smoke:
    name: Migrate and start Medusa v2 API (CI only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: medusa-backend-poc
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: medusa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa_ci -d medusa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: postgres://medusa_ci:disposable_ci_password@127.0.0.1:5432/medusa_ci
      REDIS_URL: redis://127.0.0.1:6379
      SHQIPSHOP_REQUIRE_REDIS: "true"
      SHQIPSHOP_ENFORCE_PAYMENT_TOTAL_MATCH: "true"
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000,http://localhost:5173
      AUTH_CORS: http://localhost:9000,http://localhost:5173
      # CI services and credentials are ephemeral; do NOT use this file in production.
      SHQIPSHOP_FX_ALL_PER_EUR: "100"
      SHQIPSHOP_FX_SOURCE: "CI illustrative rate, NOT current market exchange rate"
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Install pinned pnpm
        run: npm install -g pnpm@10.11.1
      - name: Generate per-run development secrets
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          cookie_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$cookie_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "COOKIE_SECRET=$cookie_secret" >> "$GITHUB_ENV"
          echo "SHQIPSHOP_FX_AS_OF=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Install locked Medusa backend dependencies
        run: pnpm install --frozen-lockfile --filter '@dtc/backend...'
      - name: Run Medusa PostgreSQL migrations
        run: pnpm --filter @dtc/backend exec medusa db:migrate
      - name: Assert payment amount match and stale/ambiguous session rejection (F07f)
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07f-payment-amount-guard-ci.ts
      - name: Assert bounded buyer-accepted checkout quote contract (F07g stage 1, CI-only)
        env:
          SHQIPSHOP_F07G_CONTRACT_CI: "true"
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07g-quote-contract-ci.ts
      - name: Prove server-verified guest and authenticated-customer quote identity (F07g stage 2B-2A)
        env:
          SHQIPSHOP_F07G_PRINCIPAL_CI: "true"
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07g-principal-binding-ci.ts
      - name: Prove atomic tenant-bound quote persistence with disposable PostgreSQL (F07g stage 2A)
        env:
          SHQIPSHOP_F07G_TRANSACTION_CI: "true"
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07g-persisted-quote-ci.ts
      - name: Assert Albania region, ALL currency, products and shipping
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/assert-albania-seed.ts
      - name: Export ephemeral publishable key into runner-local file
        env:
          SHQIPSHOP_CI_PUBLISHABLE_KEY_FILE: ${{ runner.temp }}/shqipshop-publishable-key.txt
          SHQIPSHOP_CI_EMPTY_CHANNEL_KEY_FILE: ${{ runner.temp }}/shqipshop-empty-channel-key.txt
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/export-ci-publishable-key.ts
      - name: Capture inventory levels before checkout
        env:
          SHQIPSHOP_CI_INVENTORY_SNAPSHOT: ${{ runner.temp }}/shqipshop-inventory-before.json
          SHQIPSHOP_CI_INVENTORY_MODE: before
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/assert-ci-inventory.ts
      - name: Start local Medusa API and test checkout via Store HTTP API
        env:
          SHQIPSHOP_CI_PUBLISHABLE_KEY_FILE: ${{ runner.temp }}/shqipshop-publishable-key.txt
          SHQIPSHOP_CI_EMPTY_CHANNEL_KEY_FILE: ${{ runner.temp }}/shqipshop-empty-channel-key.txt
          SHQIPSHOP_CI_ORDER_ID_FILE: ${{ runner.temp }}/shqipshop-order-id.txt
          SHQIPSHOP_CI_CART_ID_FILE: ${{ runner.temp }}/shqipshop-cart-id.txt
          SHQIPSHOP_F07E_REPRICE_PROBE: "true"
          SHQIPSHOP_F07E_REPRICE_PROOF_FILE: ${{ runner.temp }}/shqipshop-reprice-proof.json
          SHQIPSHOP_F07G_REAL_CART_CI: "true"
          SHQIPSHOP_F07G_HTTP_CI: "true"
          SHQIPSHOP_F07G_REAL_CART_PROOF_FILE: ${{ runner.temp }}/shqipshop-f07g-medusa-cart-snapshot.json
        run: |
          set -euo pipefail
          pnpm --filter @dtc/backend dev > "$RUNNER_TEMP/medusa-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:9000/health > "$RUNNER_TEMP/health.json" 2>/dev/null; then
              echo "Medusa API health endpoint returned HTTP 200"
              cat "$RUNNER_TEMP/health.json"
              fx_key="$(cat "$SHQIPSHOP_CI_PUBLISHABLE_KEY_FILE")"
              curl --fail --silent --show-error --max-time 8 \
                -H "x-publishable-api-key: $fx_key" \
                http://127.0.0.1:9000/store/shqipshop/indicative-fx \
                > "$RUNNER_TEMP/indicative-fx.json"
              node -e "const q=require(process.env.RUNNER_TEMP+'/indicative-fx.json'); if(q.available!==true || q.all_per_eur!==100 || q.indicative_only!==true || !q.source?.includes('CI')) process.exit(1); console.log('SHQIPSHOP_INDICATIVE_FX_HTTP_PASSED')"
              node scripts/store-api-checkout.mjs
              node scripts/store-api-cart-totals-ci.mjs
              node scripts/store-api-reprice-ci.mjs prepare
              node scripts/f07g-http-quote-boundary-ci.mjs
              node scripts/f07g-http-registered-customer-ci.mjs
              pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07g-live-cart-snapshot-ci.ts before
              node scripts/f07g-http-review-accept-ci.mjs before
              pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07e-store-reprice-ci.ts
              node scripts/f07g-http-review-accept-ci.mjs after
              pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07g-live-cart-snapshot-ci.ts after
              node scripts/store-api-reprice-ci.mjs verify
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "::error::Medusa backend process exited before health check"
              tail -100 "$RUNNER_TEMP/medusa-backend.log"
              exit 1
            fi
            sleep 4
          done
          echo "::error::Medusa API did not become healthy"
          tail -120 "$RUNNER_TEMP/medusa-backend.log"
          exit 1
      - name: Confirm checkout order persisted in PostgreSQL
        env:
          SHQIPSHOP_CI_ORDER_ID_FILE: ${{ runner.temp }}/shqipshop-order-id.txt
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/assert-ci-order.ts
      - name: Assert inventory reservation and no stock loss
        env:
          SHQIPSHOP_CI_INVENTORY_SNAPSHOT: ${{ runner.temp }}/shqipshop-inventory-before.json
          SHQIPSHOP_CI_INVENTORY_MODE: after
        run: pnpm --filter @dtc/backend exec medusa exec ./src/scripts/assert-ci-inventory.ts
      - name: Verify repriced active-cart final order and protected guest receipt using mock payment
        env:
          SHQIPSHOP_CI_PUBLISHABLE_KEY_FILE: ${{ runner.temp }}/shqipshop-publishable-key.txt
          SHQIPSHOP_F07E_REPRICE_PROBE: "true"
          SHQIPSHOP_F07E_REPRICE_PROOF_FILE: ${{ runner.temp }}/shqipshop-reprice-proof.json
          SHQIPSHOP_F07F_INJECT_TEST: "true"
          SHQIPSHOP_F07F_PROOF_FILE: ${{ runner.temp }}/shqipshop-f07f-stale-amount.json
        run: |
          set -euo pipefail
          pnpm --filter @dtc/backend dev > "$RUNNER_TEMP/f07e-checkout-backend.log" 2>&1 &
          backend_pid=$!
          cleanup() {
            kill "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:9000/health > /dev/null 2>&1; then
              node scripts/store-api-reprice-ci.mjs complete
              node scripts/f07f-post-session-cart-mutation-ci.mjs
              node scripts/f07f-stale-amount-http-ci.mjs prepare
              pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07f-inject-stale-ci.ts
              node scripts/f07f-stale-amount-http-ci.mjs verify
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "::error::Disposable Medusa backend exited during repricing checkout proof"
              tail -100 "$RUNNER_TEMP/f07e-checkout-backend.log"
              exit 1
            fi
            sleep 4
          done
          echo "::error::Medusa API not healthy for repricing checkout proof"
          tail -100 "$RUNNER_TEMP/f07e-checkout-backend.log"
          exit 1
      - name: CI state
        if: always()
        run: |
          echo "All services were runner-local; no database or API was deployed."
