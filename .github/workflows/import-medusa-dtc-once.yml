name: Import pinned Medusa v2 DTC starter once

on:
  push:
    branches: [feat/medusa-v2-backend-poc]
    paths:
      - .github/workflows/import-medusa-dtc-once.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'titanfit102-bit/ShqipShop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/medusa-v2-backend-poc
          persist-credentials: true
      - name: Pin and archive official MIT Medusa v2 starter
        env:
          UPSTREAM_SHA: 204130a32d80b704ab509069dcc1a2f8a61f51c1
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/medusa-v2-backend-poc'
          test ! -e medusa-backend-poc
          git clone --depth 1 --no-tags https://github.com/medusajs/dtc-starter.git "$RUNNER_TEMP/dtc"
          if ! git -C "$RUNNER_TEMP/dtc" cat-file -e "$UPSTREAM_SHA^{commit}" 2>/dev/null; then
            git -C "$RUNNER_TEMP/dtc" fetch --depth=1 origin "$UPSTREAM_SHA"
          fi
          git -C "$RUNNER_TEMP/dtc" checkout --detach "$UPSTREAM_SHA"
          test "$(git -C "$RUNNER_TEMP/dtc" rev-parse HEAD)" = "$UPSTREAM_SHA"
          mkdir medusa-backend-poc
          git -C "$RUNNER_TEMP/dtc" archive "$UPSTREAM_SHA" | tar -xf - -C medusa-backend-poc
          test -f medusa-backend-poc/LICENSE
          test -f medusa-backend-poc/pnpm-lock.yaml
          test -f medusa-backend-poc/apps/backend/package.json
          test -f medusa-backend-poc/apps/backend/medusa-config.ts
          test -f medusa-backend-poc/apps/backend/.env.template
          echo 'Verified DTC tracked file count:'
          git -C "$RUNNER_TEMP/dtc" ls-tree -r --name-only HEAD | wc -l
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -A -- medusa-backend-poc
          git rm -- .github/workflows/import-medusa-dtc-once.yml
          git diff --cached --stat | tail -10
          git commit -m 'vendor: import pinned Medusa DTC starter (MIT) for backend proof'
          git push origin HEAD:refs/heads/feat/medusa-v2-backend-poc
