name: One-time import of upstream Medusa Mobile (pinned)
on:
  push:
    branches:
      - feat/native-medusa-poc
    paths:
      - .github/workflows/import-native-once.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'titanfit102-bit/ShqipShop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dedicated import branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/native-medusa-poc
          persist-credentials: true
      - name: Import pinned source without executing it
        env:
          PINNED_UPSTREAM_SHA: 4ad76d0eb5878efdd16ed294f5a655851aa99617
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/native-medusa-poc"
          test ! -e native-medusa
          git clone --depth=1 --no-tags https://github.com/bloomsynth/medusa-mobile-react-native.git "$RUNNER_TEMP/medusa-upstream"
          if ! git -C "$RUNNER_TEMP/medusa-upstream" cat-file -e "$PINNED_UPSTREAM_SHA^{commit}" 2>/dev/null; then
            git -C "$RUNNER_TEMP/medusa-upstream" fetch --depth=1 origin "$PINNED_UPSTREAM_SHA"
          fi
          git -C "$RUNNER_TEMP/medusa-upstream" checkout --detach "$PINNED_UPSTREAM_SHA"
          test "$(git -C "$RUNNER_TEMP/medusa-upstream" rev-parse HEAD)" = "$PINNED_UPSTREAM_SHA"
          mkdir -p native-medusa
          git -C "$RUNNER_TEMP/medusa-upstream" archive "$PINNED_UPSTREAM_SHA" | tar -x -C native-medusa
          test -f native-medusa/LICENSE
          test -f native-medusa/package.json
          test -f native-medusa/app/app.tsx
          test -f native-medusa/android/app/build.gradle
          test -d native-medusa/ios
          test "$(git -C "$RUNNER_TEMP/medusa-upstream" ls-tree -r --name-only HEAD | wc -l)" -eq 170
          rm .github/workflows/import-native-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- native-medusa .github/workflows/import-native-once.yml
          git diff --cached --stat
          git commit -m "vendor: import Medusa Mobile upstream at 4ad76d0 (MIT)"
          git push origin HEAD:refs/heads/feat/native-medusa-poc
