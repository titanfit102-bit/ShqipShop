name: Android N03 registered checkout recovery

on:
  pull_request:
    paths:
      - .github/workflows/android-n03-recovery.yml
      - native-medusa/scripts/android-n03-recovery.sh
      - native-medusa/scripts/n03-android-fixture.py
      - native-medusa/app/data/checkout-quote.ts
      - native-medusa/app/screens/checkout.tsx
      - medusa-backend-poc/apps/backend/src/api/store/shqipshop/quote-review-accept-ci/route.ts
      - medusa-backend-poc/apps/backend/src/lib/checkout/quote-cart-ci.ts
      - medusa-backend-poc/apps/backend/src/scripts/f07e-store-reprice-ci.ts
      - medusa-backend-poc/apps/backend/src/scripts/f07g-all-discount-ci.ts
      - medusa-backend-poc/apps/backend/src/scripts/f08-payment-ledger-ci.ts
  workflow_dispatch:
    inputs:
      scenario:
        description: Registered ALL offer change
        type: choice
        options: [discount, catalogue]
        default: discount

permissions:
  contents: read

concurrency:
  group: android-n03-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: postgres://shqipshop_ci_a:merchantA_disposable@127.0.0.1:5432/shqipshop_ci_a
      REDIS_URL: redis://127.0.0.1:6379
      SHQIPSHOP_REQUIRE_REDIS: "true"
      SHQIPSHOP_N03_RECOVERY_CI: "true"
      SHQIPSHOP_N03_ANDROID_CI: "true"
      SHQIPSHOP_N03_ANDROID_SCENARIO: ${{ inputs.scenario || 'discount' }}
      SHQIPSHOP_F07G_N03_CI: "true"
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: medusa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U medusa_ci -d medusa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout (no persistent credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Use Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Pin package managers
        run: |
          npm install -g pnpm@10.11.1
          npm install -g "$(node -p "require('./native-medusa/package.json').packageManager")"
      - name: Provision disposable registered checkout
        working-directory: medusa-backend-poc
        env:
          SHQIPSHOP_CI_PUBLISHABLE_KEY_FILE: ${{ runner.temp }}/n03-android-key.txt
          SHQIPSHOP_CI_EMPTY_CHANNEL_KEY_FILE: ${{ runner.temp }}/n03-android-empty-key.txt
        run: |
          set -euo pipefail
          command -v psql || { sudo apt-get update -qq; sudo apt-get install -y postgresql-client; }
          PGPASSWORD=disposable_ci_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U medusa_ci -d postgres <<'SQL'
          CREATE ROLE shqipshop_ci_a LOGIN PASSWORD 'merchantA_disposable';
          CREATE DATABASE shqipshop_ci_a OWNER shqipshop_ci_a;
          REVOKE CONNECT ON DATABASE shqipshop_ci_a FROM PUBLIC;
          SQL
          export JWT_SECRET="$(openssl rand -hex 32)" COOKIE_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$COOKIE_SECRET"
          pnpm install --frozen-lockfile --filter '@dtc/backend...'
          pnpm --filter @dtc/backend exec medusa db:migrate
          pnpm --filter @dtc/backend exec medusa exec ./src/scripts/assert-albania-seed.ts
          pnpm --filter @dtc/backend exec medusa exec ./src/scripts/export-ci-publishable-key.ts
          PGPASSWORD=merchantA_disposable psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U shqipshop_ci_a -d shqipshop_ci_a <<'SQL'
          CREATE TABLE shqipshop_n03_disposable_attempt (
            attempt_id uuid PRIMARY KEY,
            cart_id text UNIQUE NOT NULL,
            owner_customer_id text,
            quote_required boolean NOT NULL DEFAULT false,
            phase text NOT NULL DEFAULT 'prepared'
              CHECK (phase IN ('prepared', 'claimed_for_dispatch', 'sealed_before_dispatch'))
          );
          SQL
          pnpm --filter @dtc/backend exec medusa exec ./src/scripts/f07g-live-cart-snapshot-ci.ts init-n03
          nohup pnpm --filter @dtc/backend exec medusa develop --port 9000 > "$RUNNER_TEMP/n03-medusa.log" 2>&1 </dev/null &
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:9000/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          python3 ../native-medusa/scripts/n03-android-fixture.py setup
          nohup python3 ../native-medusa/scripts/n03-android-fixture.py proxy > "$RUNNER_TEMP/n03-proxy.log" 2>&1 </dev/null &
      - name: Install native dependencies and Android toolchain
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          npm --prefix native-medusa ci
      - name: Bundle development JavaScript into the disposable debug build
        working-directory: native-medusa
        run: |
          set -euo pipefail
          test ! -e .env
          umask 077
          {
            printf 'MEDUSA_BACKEND_URL=http://127.0.0.1:9003\n'
            printf 'PUBLISHABLE_API_KEY=%s\n' "$(cat "$RUNNER_TEMP/n03-android-key.txt")"
            printf 'DEFAULT_LOCALE=sq-AL\nN03_REGISTERED_RECOVERY=true\nF07G_QUOTE_REVIEW=true\n'
          } > .env
          # JS remains in development mode. Launch from the packaged asset without the Metro dev menu.
          python3 - <<'PY_CONFIG'
          from pathlib import Path
          source = Path("android/app/src/main/java/com/rnstartermedusa/MainApplication.kt")
          text = source.read_text()
          anchor = "context = applicationContext,"
          assert text.count(anchor) == 1
          source.write_text(text.replace(anchor, anchor + "\n      useDevSupport = false,"))
          # Keep application warnings in logs while preventing the LogBox overlay from intercepting taps.
          entry = Path("index.js")
          index = entry.read_text()
          import_line = "import {AppRegistry} from 'react-native';"
          register = "AppRegistry.registerComponent(appName, () => App);"
          assert index.count(import_line) == index.count(register) == 1
          index = index.replace(import_line, "import {AppRegistry, LogBox} from 'react-native';")
          entry.write_text(index.replace(register, "LogBox.ignoreAllLogs();\n" + register))
          PY_CONFIG
          mkdir -p android/app/src/debug/assets
          npx --no-install react-native bundle --platform android --dev true --entry-file index.js \
            --bundle-output android/app/src/debug/assets/index.android.bundle \
            --assets-dest android/app/src/debug/res
          test -s android/app/src/debug/assets/index.android.bundle
      - name: Compile emulator debug APK
        working-directory: native-medusa/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64 -Dorg.gradle.workers.max=2
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android checkout, lost response and recovery after restart
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          emulator-boot-timeout: 420
          script: bash native-medusa/scripts/android-n03-recovery.sh
      - name: Upload sanitized proof from synthetic account
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ShqipShop-Android-N03-recovery-proof
          path: native-medusa/android/build/reports/shqipshop-n03/
          if-no-files-found: ignore
          retention-days: 4
      - name: Remove temporary credentials
        if: always()
        run: rm -f native-medusa/.env "$RUNNER_TEMP"/n03-android-*.txt "$RUNNER_TEMP"/n03-android-*.json
